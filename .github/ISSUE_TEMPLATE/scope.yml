name: Scope
description: Something to build. Claude turns each Done-when line into a test.
title: "<ID>: <short title>"
body:
  - type: markdown
    attributes:
      value: |
        Write it in plain words. Claude can draft this for you; you only edit and approve it in a comment.
        If you don't know the ID, leave `<ID>` in the title and Claude fills it in.
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should change, for whom.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Numbered outcomes a person or a test can see. One test is written for each line.
      placeholder: |
        1. The fund page shows ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: new-tables
    attributes:
      label: New tables
      description: For each new table, why it cannot be a column, a row in a shared table (see docs/data-model.md), a rule on a column, or a view. Write "none" if there are none.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this change must not touch.
    validations:
      required: false
