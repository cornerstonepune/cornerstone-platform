# THROWAWAY (branch probe-u71-timing): u71's four pages, timed the same way on two commits. Not to be merged.
name: u71-probe
on:
  push:
    branches: [probe-u71-timing]
jobs:
  probe:
    name: probe ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: before-ui2, ref: 2d39ff9 }
          - { name: main, ref: 18d42cc }
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: this probe's spec, then the commit under test
        run: |
          cp apps/web/tests/u99-probe.spec.ts "$RUNNER_TEMP/u99-probe.spec.ts"
          git checkout -q ${{ matrix.ref }}
          cp "$RUNNER_TEMP/u99-probe.spec.ts" apps/web/tests/u99-probe.spec.ts
      - run: bin/ci-postgres
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: packages/engine
      - name: the test database, started
        run: ( bin/testdb fresh "$DATABASE_URL" >"$RUNNER_TEMP/testdb.log" 2>&1; echo $? >"$RUNNER_TEMP/testdb.rc" ) &
      - run: uv run playwright install --with-deps chromium
        working-directory: packages/engine
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: the test database, built
        run: |
          while [ ! -f "$RUNNER_TEMP/testdb.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/testdb.log"
          exit "$(cat "$RUNNER_TEMP/testdb.rc")"
      - run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role app_web password 'ci-web'"
          -c "alter role app_engine password 'ci-engine'"
      - name: the whole of browser shard 3, so the copy holds what it holds when u71 runs
        working-directory: apps/web
        continue-on-error: true
        env:
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
        run: npx playwright test --shard=3/3 --retries=0 --trace off --reporter=line 2>&1 | grep -E "u71 \||passed|failed|flaky" || true
      - name: the probe on that copy, with every statement over 30 ms logged
        working-directory: apps/web
        env:
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
        run: |
          psql "$DATABASE_URL" -c "select count(distinct section) as classes, count(*) as children from child_now where active"
          psql "$DATABASE_URL" -At -c "alter system set log_min_duration_statement = 30" -c "select pg_reload_conf()"
          LOG="$RUNNER_TEMP/postgres/log"; MARK=$(wc -c <"$LOG")
          npx playwright test u99-probe --workers=1 --retries=0 --trace off --reporter=line 2>&1 | grep -E "probe \||passed|failed" || true
          echo "--- statements over 30 ms during the probe (top 25 by time)"
          tail -c +"$MARK" "$LOG" | python3 -c "
          import re,sys
          t=sys.stdin.read()
          parts=re.split(r'(?=\d{4}-\d\d-\d\d [\d:.]+ \w+ \[\d+\] LOG:  duration: )',t)
          rows=[]
          for p in parts:
              m=re.search(r'duration: ([\d.]+) ms',p)
              if m: rows.append((float(m.group(1)),' '.join(p.split())[:420]))
          rows.sort(reverse=True)
          print(len(rows),'statements')
          for d,q in rows[:25]: print(f'{d:8.1f} ms | {q[60:]}')
          "
