# THROWAWAY (branch probe-u71-timing): u71's four pages, timed the same way on two commits. Not to be merged.
name: u71-probe
on:
  push:
    branches: [probe-u71-timing]
jobs:
  probe:
    name: probe ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: main, ref: 18d42cc }
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: this probe's spec, then the commit under test
        run: |
          cp apps/web/tests/u99-probe.spec.ts "$RUNNER_TEMP/u99-probe.spec.ts"
          git checkout -q ${{ matrix.ref }}
          cp "$RUNNER_TEMP/u99-probe.spec.ts" apps/web/tests/u99-probe.spec.ts
      - run: bin/ci-postgres
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: packages/engine
      - name: the test database, started
        run: ( bin/testdb fresh "$DATABASE_URL" >"$RUNNER_TEMP/testdb.log" 2>&1; echo $? >"$RUNNER_TEMP/testdb.rc" ) &
      - run: uv run playwright install --with-deps chromium
        working-directory: packages/engine
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: the test database, built
        run: |
          while [ ! -f "$RUNNER_TEMP/testdb.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/testdb.log"
          exit "$(cat "$RUNNER_TEMP/testdb.rc")"
      - run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role app_web password 'ci-web'"
          -c "alter role app_engine password 'ci-engine'"
      - name: the whole of browser shard 3, so the copy holds what it holds when u71 runs
        working-directory: apps/web
        continue-on-error: true
        env:
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
        run: npx playwright test --shard=3/3 --retries=0 --trace off --reporter=line 2>&1 | grep -E "u71 \||passed|failed|flaky" || true
      - name: the probe on that copy, with every statement logged
        working-directory: apps/web
        env:
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
        run: |
          psql "$DATABASE_URL" -c "select (select count(distinct section) from child_now where active) as classes, (select count(*) from child_now where active) as children, (select count(*) from evidence_event) as evidence, (select count(*) from pg_class where relkind='r') as tables"
          psql "$DATABASE_URL" -At -c "alter system set log_min_duration_statement = 0" -c "select pg_reload_conf()"
          LOG="$RUNNER_TEMP/postgres/log"; MARK=$(wc -c <"$LOG")
          npx playwright test u99-probe --workers=1 --retries=0 --trace off --reporter=line 2>&1 | grep -E "probe \||passed|failed" || true
          tail -c +"$MARK" "$LOG" >"$RUNNER_TEMP/probe.log"
          wc -l "$RUNNER_TEMP/probe.log"
          python3 - "$RUNNER_TEMP/probe.log" <<'PY'
          import re,sys,collections
          t=open(sys.argv[1]).read()
          parts=re.split(r'(?=^\d{4}-\d\d-\d\d [\d:.]+ \w+ \[\d+\] LOG:  duration: )',t,flags=re.M)
          agg=collections.defaultdict(lambda:[0,0.0,0.0])
          tot=0;n=0
          for p in parts:
              m=re.search(r'duration: ([\d.]+) ms\s+(?:statement|execute [^:]*|parse [^:]*|bind [^:]*): (.*)',p,flags=re.S)
              if not m: continue
              d=float(m.group(1)); q=' '.join(m.group(2).split())
              q=re.sub(r"'[^']*'","?",q); q=re.sub(r'\b\d+\b','N',q); q=re.sub(r'\$\d+','$',q)[:230]
              a=agg[q]; a[0]+=1; a[1]+=d; a[2]=max(a[2],d); tot+=d; n+=1
          print(n,'statements, total',round(tot),'ms over the whole probe (40 page loads + warmups)')
          print('--- top 30 by total time: count | total ms | max ms | statement')
          for q,(c,s,mx) in sorted(agg.items(),key=lambda kv:-kv[1][1])[:30]: print(f'{c:6d} | {s:8.0f} | {mx:6.1f} | {q}')
          print('--- top 12 by count')
          for q,(c,s,mx) in sorted(agg.items(),key=lambda kv:-kv[1][0])[:12]: print(f'{c:6d} | {s:8.0f} | {mx:6.1f} | {q}')
          PY
