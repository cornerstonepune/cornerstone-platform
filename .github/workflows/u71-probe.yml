# THROWAWAY (branch probe-u71-timing): u71's four pages, timed the same way on two commits. Not to be merged.
name: u71-probe
on:
  push:
    branches: [probe-u71-timing]
jobs:
  probe:
    name: probe ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fix-589, ref: 879ea7c }
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: this probe's spec, then the commit under test
        run: |
          cp apps/web/tests/u99-probe.spec.ts "$RUNNER_TEMP/u99-probe.spec.ts"
          git checkout -q ${{ matrix.ref }}
          cp "$RUNNER_TEMP/u99-probe.spec.ts" apps/web/tests/u99-probe.spec.ts
      - run: bin/ci-postgres
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: packages/engine
      - name: the test database, started
        run: ( bin/testdb fresh "$DATABASE_URL" >"$RUNNER_TEMP/testdb.log" 2>&1; echo $? >"$RUNNER_TEMP/testdb.rc" ) &
      - run: uv run playwright install --with-deps chromium
        working-directory: packages/engine
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: the test database, built
        run: |
          while [ ! -f "$RUNNER_TEMP/testdb.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/testdb.log"
          exit "$(cat "$RUNNER_TEMP/testdb.rc")"
      - run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role app_web password 'ci-web'"
          -c "alter role app_engine password 'ci-engine'"
      - name: the whole of browser shard 3, so the copy holds what it holds when u71 runs
        working-directory: apps/web
        continue-on-error: true
        env:
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
        run: npx playwright test --shard=3/3 --retries=0 --trace off --reporter=line 2>&1 | grep -E "u71 \||passed|failed|flaky" || true
      - name: the probe on that copy, with the database's own counters
        working-directory: apps/web
        env:
          TEST_WEB_DATABASE_URL: postgresql://app_web:ci-web@127.0.0.1:5432/postgres
          TEST_ENGINE_DATABASE_URL: postgresql://app_engine:ci-engine@127.0.0.1:5432/postgres
        run: |
          psql "$DATABASE_URL" -c "select (select count(distinct section) from child_now where active) as classes, (select count(*) from child_now where active) as children, (select count(*) from sheet_instance) as sheets, (select count(*) from capture) as captures, (select count(*) from item_result) as results, (select count(*) from skill) as skills, (select count(*) from topic) as topics"
          dir="$RUNNER_TEMP/postgres"
          pg_ctl -D "$dir/data" -l "$dir/log2" -w restart -o "-p 5432 -k $dir -c listen_addresses=127.0.0.1 -c shared_preload_libraries=pg_stat_statements,auto_explain -c pg_stat_statements.track=all -c auto_explain.log_min_duration=90 -c auto_explain.log_analyze=on -c auto_explain.log_buffers=on -c auto_explain.log_timing=on -c auto_explain.log_nested_statements=off -c track_functions=all -c compute_query_id=on" >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pg_stat_statements" -c "select pg_stat_statements_reset()" >/dev/null
          npx playwright test u99-probe --workers=1 --retries=0 --trace off --reporter=line 2>&1 | grep -E "probe \||passed|failed" || true
          echo "--- plans of the slowest statements (auto_explain, 90 ms and over): one per statement, the slowest run"
          python3 - "$dir/log2" <<'PY'
          import re,sys,collections
          t=open(sys.argv[1],errors="replace").read()
          parts=re.split(r'(?=^\d{4}-\d\d-\d\d [\d:.]+ \w+ \[\d+\] LOG:  duration: )',t,flags=re.M)
          best={}
          for p in parts:
              m=re.search(r'duration: ([\d.]+) ms\s+plan:\s*Query Text: (.*?)\n\s*(\w.*)',p,flags=re.S)
              if not m: continue
              d=float(m.group(1)); q=' '.join(m.group(2).split())[:90]
              if q not in best or d>best[q][0]: best[q]=(d,p)
          print(len(best),'distinct slow statements')
          for q,(d,p) in sorted(best.items(),key=lambda kv:-kv[1][0])[:6]:
              body=re.sub(r'^\d{4}-\d\d-\d\d [\d:.]+ \w+ \[\d+\] LOG:  ','',p)
              print('=====',round(d),'ms |',q); print(body[:6500])
          PY
          echo "--- top 25 statements by total time (calls | total ms | mean ms | query)"
          psql "$DATABASE_URL" -At -F ' | ' -c "select calls, round(total_exec_time::numeric), round(mean_exec_time::numeric,1), left(regexp_replace(query, '\\s+', ' ', 'g'), 260) from pg_stat_statements where query not ilike '%pg_stat_statements%' order by total_exec_time desc limit 25"
          echo "--- top 12 statements by calls"
          psql "$DATABASE_URL" -At -F ' | ' -c "select calls, round(total_exec_time::numeric), round(mean_exec_time::numeric,1), left(regexp_replace(query, '\\s+', ' ', 'g'), 200) from pg_stat_statements where query not ilike '%pg_stat_statements%' order by calls desc limit 12"
          echo "--- functions by total time (calls | total ms | self ms | name)"
          psql "$DATABASE_URL" -At -F ' | ' -c "select calls, round(total_time::numeric), round(self_time::numeric), schemaname||'.'||funcname from pg_stat_user_functions order by total_time desc limit 15"
