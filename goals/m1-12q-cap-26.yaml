name: m1-12q-cap-26
goal: >
  The drafting campaign may spend the last pages' money Nimish said yes to on 8 Nov: its cap is 26.5 and its margin 0.5, so it
  stops at 26.0; nothing else about the money moves (the stage caps, their order and the per-page limit are as they were).
# Written 2026-11-08 (task M1-12q). W1, gate N1. Nimish's yes of 8 Nov, relayed by the orchestrator: "finishing the last ~65
# pages (~$1.3). Campaign stopped at $24.51 (cap 25, margin 0.5) ... raise llm.campaigns m1-11 cap so the stop lands at 26.0
# (cap 26.5, margin 0.5), nothing else changed, per-page limit 0.03 unchanged". A config row only; no model call.
says:
  - words: "raise llm.campaigns m1-11 cap so the stop lands at 26.0 (cap 26.5, margin 0.5)"
    proved_by: "packages/engine/tests/test_llm_budget.py::test_the_campaign_stops_at_26_after_nimishs_yes_of_8_nov_and_the_stages_add_up_under_it"
  - words: "nothing else changed, per-page limit 0.03 unchanged"
    proved_by: "packages/engine/tests/test_llm_budget.py::test_a_tranche_whose_pages_cost_more_than_three_cents_each_is_flagged_in_the_checkers_report"
manual:
  - "Run `load_settings` after merge: the row is read from the database, not from the file."
criteria:
  - name: the caps and the budget
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_llm_budget.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
