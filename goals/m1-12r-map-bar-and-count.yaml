name: m1-12r-map-bar-and-count
goal: >
  The linking run calls the proposer only for the activities that have no skill link and records only their skills, and says
  how many that is and what it costs before anything is spent; the precision and found bars are the ones Nimish accepted
  after the held-out run, with the result written down; the proposer v3 that run scored is switched on, and the validator stays off.
# Written 2026-11-08 (task M1-12r). W1, gate N1. Nimish's words of 8 Nov, relayed by the orchestrator: "80% bar is alright; finish
# that too (the 281 links); educators will change it if required" and "quality work, don't worry about usage"; the orchestrator:
# "set precision bar 0.80, skill_found bar 0.75, auto_passed stays 0.60, record the score as the activating eval, activate proposer
# v3 only ... Validator v2 stays INACTIVE/off ... Add propose --kind skill ... keep recording as source=machine + proposal id,
# revertible, check-me ... tell me the activity count it will call (871 vs 281) and the forecast before I dispatch".
# Nothing here made a model call.
says:
  - words: "set precision bar 0.80, skill_found bar 0.75, auto_passed stays 0.60"
    proved_by: "packages/engine/tests/test_map_kind.py::test_the_bars_are_the_ones_nimish_accepted_and_the_proposer_v3_alone_is_on"
  - words: "activate proposer v3 only"
    proved_by: "packages/engine/tests/test_map_kind.py::test_the_bars_are_the_ones_nimish_accepted_and_the_proposer_v3_alone_is_on"
  - words: "Validator v2 stays INACTIVE/off"
    proved_by: "packages/engine/tests/test_map_kind.py::test_the_bars_are_the_ones_nimish_accepted_and_the_proposer_v3_alone_is_on"
  - words: "Add propose --kind skill"
    proved_by: "packages/engine/tests/test_map_kind.py::test_the_activities_to_propose_for_are_those_with_any_gap_or_with_a_skill_gap"
  - words: "record the score as the activating eval"
    proved_by: "packages/engine/tests/test_map_kind.py::test_the_score_that_switched_the_proposer_on_is_on_record"
  - words: "tell me the activity count it will call (871 vs 281) and the forecast before I dispatch"
    proved_by: "packages/engine/tests/test_map_kind.py::test_the_estimate_says_the_count_and_what_the_proposer_costs"
  - words: "keep recording as source=machine + proposal id, revertible, check-me"
    proved_by: "packages/engine/tests/test_map_kind.py::test_with_a_kind_only_the_skills_and_their_offers_are_kept_and_with_none_everything_is"
manual:
  - "After merge: `load_settings` (bars, prompt switch), then the free `forecast` run prints the exact count and the proposer price for the skill gaps, then `map_propose` (spends). The count on live is not known to the builder: this sandbox cannot read the live database."
criteria:
  - name: the bars, the switch, the scope of the run
    run: cd packages/engine && uv run pytest -q -p no:cacheprovider tests/test_map_kind.py tests/test_curriculum_run_command.py
    expect: "passed"
  - name: the code sits where the map says; every promise has its command; lint
    run: bin/check
    expect: "passed"
